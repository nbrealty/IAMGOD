# Runs both paper-trading books once per weekday after the US market close.
# Off until you set the repository variable PAPER_TRADING_ENABLED=true.
# State (positions, equity history, journal) is kept on the `trading-state` branch.
name: Paper trading

on:
  schedule:
    - cron: "35 21 * * 1-5" # 21:35 UTC, after the 16:00 New York close all year
  workflow_dispatch:
    inputs:
      book:
        description: "Which book to run"
        type: choice
        options: [both, rules, claude]
        default: both
      dry_run:
        description: "Compute only, place no orders"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: paper-trading
  cancel-in-progress: false

jobs:
  run:
    if: ${{ vars.PAPER_TRADING_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: trading/requirements.txt

      - run: pip install -r trading/requirements.txt

      - name: Load saved state
        env:
          REPO_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
        run: |
          if git ls-remote --exit-code --heads "$REPO_URL" trading-state >/dev/null; then
            git clone --quiet --branch trading-state --single-branch "$REPO_URL" state
          else
            mkdir state && cd state && git init --quiet -b trading-state && git remote add origin "$REPO_URL"
          fi

      - name: Run books
        working-directory: trading
        env:
          TRADER_STATE_DIR: ${{ github.workspace }}/state
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          ALPACA_DATA_KEY: ${{ secrets.ALPACA_RULES_KEY }}
          ALPACA_DATA_SECRET: ${{ secrets.ALPACA_RULES_SECRET }}
          ALPACA_RULES_KEY: ${{ secrets.ALPACA_RULES_KEY }}
          ALPACA_RULES_SECRET: ${{ secrets.ALPACA_RULES_SECRET }}
          ALPACA_CLAUDE_KEY: ${{ secrets.ALPACA_CLAUDE_KEY }}
          ALPACA_CLAUDE_SECRET: ${{ secrets.ALPACA_CLAUDE_SECRET }}
        run: |
          python -m trader run --book "${{ inputs.book || 'both' }}" ${{ inputs.dry_run && '--dry-run' || '' }}
          python -m trader status
          python -m trader report

      - name: Save state
        if: always()
        working-directory: state
        run: |
          git config user.name "paper-trading-bot"
          git config user.email "paper-trading-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit --quiet -m "State after run on $(date -u +%F)"
          if git rev-parse --verify --quiet HEAD >/dev/null; then git push --quiet origin trading-state; fi
